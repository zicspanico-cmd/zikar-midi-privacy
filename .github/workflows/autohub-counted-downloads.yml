name: Publish counted AutoHub downloads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'autohub/latest.json'
      - '.github/workflows/autohub-counted-downloads.yml'
permissions:
  contents: write
concurrency:
  group: autohub-public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK and publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .versionName autohub/latest.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          apk="autohub/AutoHub-EC3-$version.apk"
          test -f "$apk"
          expected="$(jq -r .sha256 autohub/latest.json)"
          actual="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          test "$expected" = "$actual"
          tag="autohub-v$version"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "AutoHub Connect Parking $version" --notes "APK AutoHub Connect Parking $version. Installare sopra la versione precedente." --latest
          fi
          notes="autohub/releases/autohub-parking-v$version.md"
          if [[ -f "$notes" ]]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "AutoHub Connect Parking $version" --notes-file "$notes" --latest
          else
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "AutoHub Connect Parking $version" --latest
          fi
          mkdir -p "$RUNNER_TEMP/autohub"
          versioned_asset="AutoHub-Connect-Parking-$version.apk"
          cp "$apk" "$RUNNER_TEMP/autohub/$versioned_asset"
          gh release upload "$tag" "$RUNNER_TEMP/autohub/$versioned_asset" --repo "$GITHUB_REPOSITORY" --clobber
          mkdir -p "$RUNNER_TEMP/verify-versioned"
          gh release download "$tag" --pattern "$versioned_asset" --dir "$RUNNER_TEMP/verify-versioned" --repo "$GITHUB_REPOSITORY"
          test "$(sha256sum "$RUNNER_TEMP/verify-versioned/$versioned_asset" | cut -d ' ' -f 1)" = "$expected"
          # Older installed apps only accept versioned APK URLs under the raw download root.
          url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/autohub/AutoHub-EC3-$version.apk"
          # Public download name (no car model); the old technical copy stays for installed apps.
          cp "$apk" "autohub/AutoHub-Connect-Parking.apk"
          cp "$apk" "autohub/AutoHub-EC3.apk"
          jq --arg url "$url" '.apkUrl = $url' autohub/latest.json > "$RUNNER_TEMP/latest.json"
          cp "$RUNNER_TEMP/latest.json" autohub/latest.json
          if ! git diff --quiet -- autohub/latest.json autohub/AutoHub-EC3.apk autohub/AutoHub-Connect-Parking.apk; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add autohub/latest.json autohub/AutoHub-EC3.apk autohub/AutoHub-Connect-Parking.apk
            git commit -m "Keep AutoHub $version legacy updates and direct download in sync"
            git push
          fi
